  <body>
    <div id="root"></div>

    <script>
      // PWA service worker
      if ("serviceWorker" in navigator) {
        const isDev = ["localhost", "127.0.0.1"].includes(location.hostname) || location.port === "3000" || location.hostname.endsWith(".manus.computer");
        if (isDev) {
          navigator.serviceWorker.getRegistrations().then((regs) => regs.forEach((r) => r.unregister()));
          caches.keys().then((keys) => keys.filter((k) => k.startsWith("voyagr-shell-")).forEach((k) => caches.delete(k)));
        } else {
          window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js"));
        }
      }
    </script>
